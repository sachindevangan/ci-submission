name: B12 Application Submission

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Submit application
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          APPLICANT_NAME: "Sachin Devangan"
          APPLICANT_EMAIL: "dsachin.98@gmail.com"
          RESUME_LINK: "https://www.linkedin.com/in/sachindevangan"
          REPOSITORY_LINK: ${{ github.server_url }}/${{ github.repository }}
          ACTION_RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python apply.py
